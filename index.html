<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>廿四节气签</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="摇三下,抽一支今天的节气签。">
<style>
/* Layout: 一只青花签筒立在月白釉色上;出签后整页换成该节气的颜色,签纸竖排,右起左读。 */
:root {
  color-scheme: light;
  --moon: #E9F0F3;
  --glaze: #F8FBFC;
  --cobalt: #1E3F8A;
  --cobalt-deep: #14295E;
  --bamboo: #D9BE85;
  --bamboo-edge: #AE8F52;
  --cinnabar: #BE3528;
  --ink: #1A2740;
  --mute: #56657E;
  --term: #1E3F8A;
  --term-pale: #E9F0F3;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--term-pale);
  color: var(--ink);
  font: 16px/1.7 var(--sans);
  transition: background .6s ease;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 440px;
  margin: 0 auto;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scene { display: grid; gap: 18px; }

/* 求签 */
.invite { margin: 0; color: var(--cinnabar); font-family: var(--serif); font-size: 17px; text-align: center; }
.mast { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
.tube-wrap {
  border: 0; padding: 0; margin: 0; background: none; cursor: pointer;
  justify-self: center; width: min(50vw, 200px); max-width: 100%;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.tube-wrap:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 4px; }
.tube { display: block; width: 100%; height: auto; overflow: visible; }
.tube-wrap.shaking .tube { animation: rattle .46s ease-in-out; transform-origin: 50% 92%; }
.tube-wrap.shaking .stick { animation: hop .46s ease-in-out; animation-delay: calc(var(--i) * 18ms); }
.stick { transform-box: fill-box; transform-origin: 50% 100%; }
#chosen { transition: transform .85s cubic-bezier(.2, .8, .25, 1); }
.tube-wrap.drawn #chosen { transform: translateY(-96px); }
@keyframes rattle {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-7deg) translateY(-3px); }
  45% { transform: rotate(6deg) translateY(1px); }
  70% { transform: rotate(-4deg) translateY(-2px); }
}
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 70% { transform: translateY(4px); } }

.title { display: flex; flex-direction: row-reverse; gap: 8px; align-self: start; }
.title h1 { margin: 0; writing-mode: vertical-rl; color: var(--cobalt-deep); font: 700 44px/1.1 var(--kai); letter-spacing: .1em; }
.title p { margin: 0; writing-mode: vertical-rl; color: var(--mute); font-family: var(--serif); font-size: 14px; letter-spacing: .24em; }

.fields { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
.field > label, .field > legend { padding: 0; color: var(--mute); font-size: 14px; }
#name {
  width: 100%; padding: 10px 12px; border: 1px solid var(--cobalt); border-radius: 3px;
  background: var(--glaze); color: var(--ink); font: 17px var(--serif);
}
#name:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 1px; }
#name::placeholder { color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span {
  display: block; padding: 6px 12px; border: 1px solid var(--cobalt); border-radius: 3px;
  background: var(--glaze); color: var(--cobalt); font-size: 15px; cursor: pointer;
}
.chip input:checked + span { background: var(--cobalt); color: var(--glaze); }
.chip input:focus-visible + span { outline: 2px solid var(--cinnabar); outline-offset: 2px; }

.btn {
  display: block; width: 100%; min-height: 48px; padding: 10px 16px;
  border: 1px solid var(--term); border-radius: 3px; background: var(--glaze); color: var(--term);
  font: 600 17px var(--serif); letter-spacing: .08em; cursor: pointer; touch-action: manipulation;
}
.btn.primary { background: var(--term); color: var(--glaze); }
.btn:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }
#shake { display: flex; align-items: center; justify-content: center; gap: 12px; }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border: 1px solid currentColor; border-radius: 50%; }
.dots i.on { background: currentColor; }
.fine { margin: 0; color: var(--mute); font-size: 13px; line-height: 1.6; text-align: center; }

/* 签纸 */
.slip {
  display: grid; gap: 14px; padding: 16px; background: var(--glaze); color: var(--ink);
  outline: 1px solid var(--term); outline-offset: -6px; border: 2px solid var(--term);
}
.slip.reveal { animation: unroll .7s cubic-bezier(.2, .8, .25, 1) both; }
@keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.slip-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 6px 0; }
.slip-head b { color: var(--term); font: 700 19px var(--serif); letter-spacing: .14em; }
.seal {
  display: grid; place-items: center; width: 44px; height: 44px; flex: none; padding: 2px;
  border-radius: 3px; background: var(--cinnabar); color: var(--glaze);
  font: 700 18px/1.05 var(--kai); text-align: center; transform: rotate(-4deg);
}
.seal.wide { writing-mode: vertical-rl; letter-spacing: 0; }
.verse { display: flex; flex-direction: row-reverse; justify-content: space-between; gap: 10px; padding: 4px 6px; }
.term { margin: 0; writing-mode: vertical-rl; color: var(--term); font: 700 54px/1.1 var(--kai); letter-spacing: .12em; }
.poem { margin: 0; display: flex; flex-direction: row-reverse; gap: 12px; }
.poem p { margin: 0; writing-mode: vertical-rl; font: 400 25px/1.2 var(--kai); letter-spacing: .1em; }
.slip.reveal .poem p { animation: ink .6s ease both; animation-delay: calc(.45s + var(--i) * .2s); }
@keyframes ink { from { opacity: .08; } to { opacity: 1; } }
.who { margin: 0; display: flex; flex-direction: row-reverse; gap: 4px; color: var(--mute); font-family: var(--serif); font-size: 14px; line-height: 1.25; }
.who span { writing-mode: vertical-rl; letter-spacing: .08em; }
.gloss { margin: 0; padding: 12px 6px 0; border-top: 1px solid var(--term); font: 400 18px/1.75 var(--serif); }
.reads { display: grid; gap: 8px; margin: 0; padding: 0 6px; }
.read { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 8px; margin: 0; }
.read dt { color: var(--term); font-weight: 600; }
.read dd { margin: 0; min-width: 0; }
.read.asked { padding: 10px; background: var(--term-pale); }
.omens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 6px; }
.omen { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
.omen b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: var(--glaze); font: 700 15px var(--serif); }
.omen.yi b { background: var(--term); }
.omen.ji b { background: var(--cinnabar); }
.omen ul { margin: 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.5; }
.luck { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; padding: 10px 0 2px; border-top: 1px solid var(--term); text-align: center; }
.luck div { min-width: 0; }
.luck dt { color: var(--mute); font-size: 12px; }
.luck dd { margin: 0; font: 600 17px/1.4 var(--serif); }
.luck small { display: block; color: var(--mute); font: 12px/1.3 var(--sans); }
.swatch { display: inline-block; width: 11px; height: 11px; margin-right: 3px; border-radius: 2px; background: var(--term); }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.actions .primary { grid-column: 1 / -1; }
#pass[hidden] + #again { grid-column: 1 / -1; }
#linkbox { margin: 0; padding: 10px; background: var(--glaze); font-size: 14px; word-break: break-all; }

/* 存图 */
#sheet {
  position: fixed; inset: 0; z-index: 20; overflow: auto; display: grid; justify-items: center; align-content: center; gap: 12px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--cobalt-deep);
}
#sheet img { display: block; width: auto; max-width: 100%; max-height: 74vh; }
#sheet p { margin: 0; color: var(--glaze); font-size: 15px; text-align: center; }
#sheet .btn { max-width: 200px; border-color: var(--glaze); background: none; color: var(--glaze); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<main id="app">

    <p id="invite" class="invite" hidden></p>
    <div class="mast">
      <button id="tube" class="tube-wrap" type="button" aria-label="摇动签筒">

            </g>
          </defs>
          <g id="chosen">
            <use href="#s" transform="translate(110 -6)"/>

            <rect x="40" y="258" width="140" height="70" fill="url(#wave)"/>
            <path d="M46 132h128M46 138h128M46 252h128M46 258h128" stroke="#1E3F8A" stroke-width="2"/>

          <circle cx="110" cy="195" r="36" fill="none" stroke="#1E3F8A"/>
          <text x="110" y="212" text-anchor="middle" fill="#1E3F8A" font-size="46" font-weight="700" style="font-family:var(--kai)">签</text>
          <ellipse cx="110" cy="118" rx="58" ry="8" fill="none" stroke="#1E3F8A" stroke-width="2.5"/>
        </svg>
      </button>
      <div class="title">
        <h1>廿四节气签</h1>
        <p>一日一问 一事一签</p>
      </div>
    </div>

    <form id="askForm" class="fields">
      <div class="field">
        <label for="name">怎么称呼你</label>
        <input id="name" type="text" maxlength="8" autocomplete="off" placeholder="名字或外号,不写也行">
      </div>
      <fieldset class="field">
        <legend>想问什么</legend>
        <div id="topics" class="chips"></div>
      </fieldset>
      <button id="shake" class="btn primary" type="submit">
        <span id="shakeText">摇一下</span>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </form>
    <p class="fine">摇三下出签。同一天问同一件事,签不会变。<br>名字只用来算签,不会上传。</p>
  </section>

  <section id="result" class="scene" aria-label="签文" hidden>
    <article id="slip" class="slip"></article>
    <div class="actions">
      <button id="save" class="btn primary" type="button">存成图片</button>
      <button id="pass" class="btn" type="button">发给下一位</button>
      <button id="again" class="btn" type="button">换个问题</button>
    </div>
    <p id="linkbox" hidden></p>
    <p class="fine">图个开心,当不得真。大事还请自己拿主意。</p>
  </section>
</main>

<div id="sheet" role="dialog" aria-label="签图" hidden>
  <img id="sheetImg" alt="">
  <p>手机上长按图片保存或转发,电脑上右键另存。</p>
  <button id="sheetClose" class="btn" type="button">收起</button>
</div>

const TOPICS = { general: '今日运势', work: '事业学业', money: '财运', love: '感情', body: '身体' };
const READS = [['work', '事业'], ['money', '财运'], ['love', '感情'], ['body', '身体']];
const HOURS = [['子时', '23–1点'], ['丑时', '1–3点'], ['寅时', '3–5点'], ['卯时', '5–7点'], ['辰时', '7–9点'], ['巳时', '9–11点'], ['午时', '11–13点'], ['未时', '13–15点'], ['申时', '15–17点'], ['酉时', '17–19点'], ['戌时', '19–21点'], ['亥时', '21–23点']];
const WAYS = ['正东', '东南', '正南', '西南', '正西', '西北', '正北', '东北'];
const SERIF = '"Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif';
const KAI = '"Kaiti SC", "STKaiti", "KaiTi", "BiauKai", ' + SERIF;
const DEFAULT_NAME = '有缘人';
const NAME_KEY = 'jieqi-qian-name';

const $ = id => document.getElementById(id);
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
// 只有直接打开的网页才有可转发的真实地址,嵌在别的页面里时拿到的是框架地址
const canLink = window.self === window.top && /^https?:$/.test(location.protocol);
const dots = [...document.querySelectorAll('.dots i')];
let count = 0, drawing = false, current = null;

function hash(s) {
  let h = 2166136261;
  for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h >>> 0;
}

function cn(n) {
  const d = '〇一二三四五六七八九';
  if (n <= 10) return n === 10 ? '十' : d[n];
  if (n < 20) return '十' + d[n - 10];
  return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
}

function pick(name, topic, now) {
  const day = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
  const seed = `${name}|${topic}|${day}`;
  const i = hash(seed) % SIGNS.length;
  return {
    i, sign: SIGNS[i], name, topic,
    date: `${cn(now.getMonth() + 1)}月${cn(now.getDate())}日`,
    hour: HOURS[hash(seed + '时') % 12],
    way: WAYS[hash(seed + '方') % 8],
    num: hash(seed + '数') % 9 + 1,
  };
}

function pale(hex) {
  const v = parseInt(hex.slice(1), 16), mix = c => Math.round(c + (255 - c) * .86);
  return `rgb(${mix(v >> 16 & 255)},${mix(v >> 8 & 255)},${mix(v & 255)})`;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function clack() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    clack.ctx = clack.ctx || new AC();
    const ac = clack.ctx, t = ac.currentTime;
    if (ac.state === 'suspended') ac.resume();
    for (let i = 0; i < 5; i++) {
      const o = ac.createOscillator(), g = ac.createGain(), s = t + i * .05 + Math.random() * .02;
      o.type = 'square';
      o.frequency.value = 1300 + Math.random() * 1700;
      g.gain.setValueAtTime(.04, s);
      g.gain.exponentialRampToValueAtTime(.001, s + .035);
      o.connect(g); g.connect(ac.destination);
      o.start(s); o.stop(s + .04);
    }
  } catch (e) {}
}

function shake() {
  if (drawing) return;
  count++;
  dots.forEach((d, i) => d.classList.toggle('on', i < count));
  $('shakeText').textContent = ['摇一下', '再摇两下', '最后一下', '出签了'][count];
  clack();
  try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
  const tube = $('tube');
  tube.classList.remove('shaking');
  void tube.getBoundingClientRect();
  tube.classList.add('shaking');
  if (count >= 3) draw();
}

function draw() {
  drawing = true;
  const name = $('name').value.trim() || DEFAULT_NAME;
  const topic = document.querySelector('input[name="topic"]:checked').value;
  current = pick(name, topic, new Date());
  try { if (name !== DEFAULT_NAME) localStorage.setItem(NAME_KEY, name); } catch (e) {}
  const label = $('chosenLabel');
  label.textContent = '';
  [...current.sign.t].forEach((ch, i) => {
    const t = document.createElementNS(label.namespaceURI, 'tspan');
    t.setAttribute('x', 110);
    t.setAttribute('dy', i ? 10 : 0);
    t.textContent = ch;
    label.append(t);
  });
  setTimeout(() => $('tube').classList.add('drawn'), reduced ? 0 : 460);
  setTimeout(() => show(current), reduced ? 0 : 1550);
}

function show(r) {
  const s = r.sign, slip = $('slip');
  document.documentElement.style.setProperty('--term', s.c);
  document.documentElement.style.setProperty('--term-pale', pale(s.c));
  slip.textContent = '';
  slip.classList.remove('reveal');

  const head = el('div', 'slip-head');
  head.append(el('b', '', `第${cn(r.i + 1)}签`), el('div', s.lv.length > 1 ? 'seal wide' : 'seal', s.lv));

  const verse = el('div', 'verse');
  const poem = el('div', 'poem');
  s.poem.forEach((line, i) => {
    const p = el('p', '', line);
    p.style.setProperty('--i', i);
    poem.append(p);
  });
  const who = el('p', 'who');
  who.append(el('span', '', r.name), el('span', '', `${r.date} 问${TOPICS[r.topic]}`));
  verse.append(el('h2', 'term', s.t), poem, who);

  const reads = el('dl', 'reads');
  const order = READS.slice().sort((a, b) => (b[0] === r.topic) - (a[0] === r.topic));
  order.forEach(([k, label]) => {
    const row = el('div', k === r.topic ? 'read asked' : 'read');
    row.append(el('dt', '', label), el('dd', '', s[k]));
    reads.append(row);
  });

  const omens = el('div', 'omens');
  [['yi', '宜', s.yi], ['ji', '忌', s.ji]].forEach(([cls, label, items]) => {
    const box = el('div', 'omen ' + cls), ul = el('ul');
    items.forEach(t => ul.append(el('li', '', t)));
    box.append(el('b', '', label), ul);
    omens.append(box);
  });

  const luck = el('dl', 'luck');
  const cell = (label, value, note, swatch) => {
    const d = el('div'), dd = el('dd');
    if (swatch) dd.append(el('i', 'swatch'));
    dd.append(document.createTextNode(value));
    if (note) dd.append(el('small', '', note));
    d.append(el('dt', '', label), dd);
    luck.append(d);
  };
  cell('吉时', r.hour[0], r.hour[1]);
  cell('吉方', r.way, '向这边走走');
  cell('吉数', cn(r.num), `${r.num}`);
  cell('本色', s.cn, s.t, true);

  slip.append(head, verse, el('p', 'gloss', s.gloss), reads, omens, luck);
  $('ask').hidden = true;
  $('result').hidden = false;
  $('pass').hidden = !canLink;
  $('linkbox').hidden = true;
  window.scrollTo(0, 0);
  void slip.getBoundingClientRect();
  slip.classList.add('reveal');
}

function reset() {
  count = 0; drawing = false;
  dots.forEach(d => d.classList.remove('on'));
  $('shakeText').textContent = '摇一下';
  $('tube').classList.remove('drawn', 'shaking');
  $('result').hidden = true;
  $('ask').hidden = false;
  document.documentElement.style.removeProperty('--term');
  document.documentElement.style.removeProperty('--term-pale');
  window.scrollTo(0, 0);
}

function wrap(x, text, width) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (x.measureText(line + ch).width > width && line) { lines.push(line); line = ''; }
    line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

function renderImage(r) {
  const s = r.sign, W = 1080, M = 96, inner = W - M * 2, ink = '#1A2740', mute = '#56657E';
  const probe = document.createElement('canvas').getContext('2d');
  const asked = r.topic === 'general' ? READS : READS.filter(a => a[0] === r.topic);

  // 先量高度:解曰和各条解读的行数随文字长短变化
  probe.font = `42px ${SERIF}`;
  const gloss = wrap(probe, s.gloss, inner);
  probe.font = `36px ${SERIF}`;
  const reads = asked.map(([k, label]) => ({ label, lines: wrap(probe, s[k], inner - 110) }));
  const top = 860;
  const H = top + 60 + gloss.length * 64 + 36 + reads.reduce((a, b) => a + b.lines.length * 54 + 18, 0) + 300;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = pale(s.c); x.fillRect(0, 0, W, H);
  x.fillStyle = '#F8FBFC'; x.fillRect(40, 40, W - 80, H - 80);
  x.strokeStyle = s.c;
  x.lineWidth = 6; x.strokeRect(40, 40, W - 80, H - 80);
  x.lineWidth = 2; x.strokeRect(56, 56, W - 112, H - 112);
  x.textBaseline = 'top';

  x.fillStyle = s.c; x.font = `700 44px ${SERIF}`; x.textAlign = 'left';
  x.fillText(`第${cn(r.i + 1)}签`, M, 100);

  // 朱砂印
  x.save();
  x.translate(W - M - 56, 128); x.rotate(-.07);
  x.fillStyle = '#BE3528'; x.fillRect(-56, -56, 112, 112);
  x.fillStyle = '#F8FBFC'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const lv = [...s.lv];
  x.font = `700 ${lv.length > 1 ? 46 : 70}px ${KAI}`;
  lv.forEach((ch, i) => x.fillText(ch, 0, lv.length > 1 ? (i - .5) * 48 : 0));
  x.restore();
  x.textBaseline = 'top'; x.textAlign = 'center';

  // 竖排:节气在最右,诗句右起,问签人在最左
  const col = (text, cx, y, size, step) => [...text].forEach((ch, i) => x.fillText(ch, cx, y + i * step));
  x.fillStyle = s.c; x.font = `700 124px ${KAI}`;
  col(s.t, W - 170, 240, 124, 150);
  x.fillStyle = ink; x.font = `400 70px ${KAI}`;
  s.poem.forEach((line, i) => col(line, W - 340 - i * 130, 220, 70, 86));
  x.fillStyle = mute; x.font = `32px ${SERIF}`;
  col([...r.name].slice(0, 8).join(''), 150, 220, 32, 42);
  col(`${r.date}`, 200, 220, 32, 42);

  x.strokeStyle = s.c; x.lineWidth = 2;
  x.beginPath(); x.moveTo(M, top); x.lineTo(W - M, top); x.stroke();

  let y = top + 40;
  x.textAlign = 'left'; x.fillStyle = ink; x.font = `42px ${SERIF}`;
  gloss.forEach(l => { x.fillText(l, M, y); y += 64; });
  y += 24;
  reads.forEach(({ label, lines }) => {
    x.fillStyle = s.c; x.font = `700 36px ${SERIF}`;
    x.fillText(label, M, y);
    x.fillStyle = ink; x.font = `36px ${SERIF}`;
    lines.forEach(l => { x.fillText(l, M + 110, y); y += 54; });
    y += 18;
  });
  y += 16;
  x.font = `36px ${SERIF}`;
  x.fillStyle = s.c; x.fillText('宜', M, y);
  x.fillStyle = ink; x.fillText(s.yi.join('、'), M + 60, y);
  x.fillStyle = '#BE3528'; x.fillText('忌', W / 2 + 20, y);
  x.fillStyle = ink; x.fillText(s.ji.join('、'), W / 2 + 80, y);
  y += 80;
  x.fillStyle = mute; x.font = `32px ${SERIF}`;
  x.fillText(`吉时 ${r.hour[0]}   吉方 ${r.way}   吉数 ${cn(r.num)}   本色 ${s.cn}`, M, y);
  x.textAlign = 'center'; x.font = `30px ${SERIF}`;
  x.fillText('廿四节气签 · 图个开心,当不得真', W / 2, H - 112);
  return cv.toDataURL('image/png');
}

$('save').addEventListener('click', () => {
  try {
    $('sheetImg').src = renderImage(current);
    $('sheetImg').alt = `第${cn(current.i + 1)}签 ${current.sign.t} ${current.sign.lv}`;
    $('sheet').hidden = false;
    $('sheetClose').focus();
  } catch (e) {
    $('linkbox').textContent = '图片没有生成成功,直接截图也一样。';
    $('linkbox').hidden = false;
  }
});
$('sheetClose').addEventListener('click', () => { $('sheet').hidden = true; });

$('pass').addEventListener('click', async () => {
  const mine = current.name === DEFAULT_NAME ? '' : '?from=' + encodeURIComponent(current.name);
  const link = location.origin + location.pathname + mine;
  const box = $('linkbox');
  box.hidden = false;
  try {
    await navigator.clipboard.writeText(link);
    box.textContent = '链接已复制,去微信粘贴给朋友。';
  } catch (e) {
    box.textContent = link;
    getSelection().selectAllChildren(box);
  }
});

$('again').addEventListener('click', reset);
$('tube').addEventListener('click', shake);
$('askForm').addEventListener('submit', e => { e.preventDefault(); shake(); });

let lastShake = 0;
window.addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity, now = Date.now();
  if (!a || $('ask').hidden) return;
  const force = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
  if (force > 34 && now - lastShake > 450) { lastShake = now; shake(); }
}, { passive: true });

Object.entries(TOPICS).forEach(([value, label], i) => {
  const chip = el('label', 'chip'), input = el('input');
  input.type = 'radio'; input.name = 'topic'; input.id = 'topic-' + value; input.value = value; input.checked = i === 0;
  chip.append(input, el('span', '', label));
  $('topics').append(chip);
});

try {
  const saved = localStorage.getItem(NAME_KEY);
  if (saved) $('name').value = saved;
} catch (e) {}

const from = [...(new URLSearchParams(location.search).get('from') || '')].slice(0, 8).join('');
if (from) {
  $('invite').textContent = `${from} 请你抽一支签`;
  $('invite').hidden = false;
}
</script>
</body>
</html>
